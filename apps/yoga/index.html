<!doctype html>
<html lang="pl" data-theme="dark" data-tier="high">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>yoga-auto</title>
    <style>
      /* Tło przed załadowaniem JS/CSS — bez białego błysku przy starcie kiosku. */
      html,
      body {
        background: #0b0d12;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- Filtry SVG Liquid Glass (refrakcja). Muszą być w DOM przed CSS, który je referuje (DESIGN.md §2).
         Placeholder: S3 dostarcza docelowe definicje (generator map przemieszczeń / injectFilters()) —
         po ich dostarczeniu wkleić je tutaj (brief S4, zadanie 7). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceGraphic" stdDeviation="0" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
